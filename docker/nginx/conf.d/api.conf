# Nginx sits in front of the Go API Gateway (TLS termination at this layer in production).
# Static frontend is served here; all API traffic is proxied to api-gateway.

server {
    listen 80;
    server_name _;

    # Frontend static assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API Gateway health (backward compatible)
    location /gateway/health {
        proxy_pass http://api_gateway/gateway/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # All API traffic → Go API Gateway
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Admin-API-Key $http_x_admin_api_key;
    }
}
