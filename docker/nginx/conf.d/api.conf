# API Gateway — routes external traffic to internal CEX services.
# Core exchange logic stays off-chain; blockchain routes go to blockchain-service.

server {
    listen 80;
    server_name _;

    # Frontend static assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Gateway health
    location /gateway/health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Auth
    location /api/v1/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # Users
    location /api/v1/users/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orders (includes in-process matching engine)
    location /api/v1/orders {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Matching engine (standalone — future split from order-service)
    location /api/v1/matching/ {
        proxy_pass http://matching_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Market data
    location /api/v1/market/ {
        proxy_pass http://market_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ledger
    location /api/v1/ledger/ {
        proxy_pass http://ledger_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Wallet
    location /api/v1/wallet/ {
        proxy_pass http://wallet_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Blockchain (EVM isolation layer)
    location /api/v1/blockchain/ {
        proxy_pass http://blockchain_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
