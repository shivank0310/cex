# CEX full stack — run from repo root:
#   docker compose -f docker/docker-compose.yml up --build
name: cex

x-go-service: &go-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  networks:
    - cex

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cex
      POSTGRES_PASSWORD: cex
      POSTGRES_DB: cex
    # No host port — avoids conflict with local Postgres on :5432; services use postgres:5432 internally
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex -d cex"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cex

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    # No host port — avoids conflict with local Redis on :6379; services use redis:6379 internally
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cex

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    hostname: kafka
    # No host port — avoids conflict with local Kafka on :9092; services use kafka:9092 internally
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 8
    networks:
      - cex

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in orders trades orderbook ledger settlement notifications; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
        echo "Kafka topics ready."
    networks:
      - cex

  # ── API Gateway + Nginx (edge) ──────────────────────────────────────────────

  api-gateway:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: api-gateway/cmd/api-gateway
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      RATE_LIMIT_PER_MINUTE: "300"
      CORS_ALLOWED_ORIGINS: "*"
      AUTH_SERVICE_URL: http://auth-service:8090
      USER_SERVICE_URL: http://user-service:8091
      ORDER_SERVICE_URL: http://order-service:8081
      MARKET_DATA_URL: http://market-data:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      WALLET_SERVICE_URL: http://wallet-service:8084
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8085
      ADMIN_SERVICE_URL: http://admin-service:8087
      MATCHING_SERVICE_URL: http://matching-service:8092
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started
      market-data:
        condition: service_started
      ledger-service:
        condition: service_started
      wallet-service:
        condition: service_started
      blockchain-service:
        condition: service_started
      admin-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/gateway/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8088:80"   # 8088 on host — avoids conflict with Apache/other services on :80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/gateway/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cex

  # ── Core CEX Services ───────────────────────────────────────────────────────

  binance-adapter-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: binance-adapter-service/cmd/binance-adapter-service
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8086"
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  order-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: order-service/cmd/order-service
    environment:
      HTTP_ADDR: ":8081"
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      JWT_SECRET: cex-dev-jwt-secret-change-in-production
      JWT_ISSUER: cex-auth
      LEDGER_URL: http://ledger-service:8083
      BINANCE_ADAPTER_URL: http://binance-adapter-service:8086
      ROUTE_BINANCE: "1"
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      binance-adapter-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  market-data:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: market-data/cmd/market-data
    environment:
      HTTP_ADDR: ":8082"
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      BINANCE_ADAPTER_URL: http://binance-adapter-service:8086
      EXTERNAL_SYMBOLS: BTC/USDT
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      binance-adapter-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  ledger-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: ledger-service/cmd/ledger-service
    environment:
      HTTP_ADDR: ":8083"
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  wallet-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: wallet-service/cmd/wallet-service
    environment:
      HTTP_ADDR: ":8084"
      LEDGER_URL: http://ledger-service:8083
      BLOCKCHAIN_URL: http://blockchain-service:8085
    ports:
      - "8084:8084"
    depends_on:
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  blockchain-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: blockchain-service/cmd/blockchain-service
    environment:
      HTTP_ADDR: ":8085"
      WALLET_SERVICE_URL: http://wallet-service:8084
      REQUIRED_CONFIRMATIONS: "1"
    ports:
      - "8085:8085"
    depends_on:
      wallet-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  admin-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: admin-service/cmd/admin-service
    environment:
      HTTP_ADDR: ":8087"
      ADMIN_API_KEY: admin-dev-key
      ORDER_SERVICE_URL: http://order-service:8081
      MARKET_DATA_URL: http://market-data:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      WALLET_SERVICE_URL: http://wallet-service:8084
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8085
    ports:
      - "8087:8087"
    depends_on:
      order-service:
        condition: service_started
      market-data:
        condition: service_started
      ledger-service:
        condition: service_started
      blockchain-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  settlement-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: settlement-service/cmd/settlement-service
    environment:
      KAFKA_BROKERS: kafka:9092
      LEDGER_URL: http://ledger-service:8083
      HEALTH_ADDR: ":8096"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "8096:8096"

  notification-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: notification-service/cmd/notification-service
    environment:
      KAFKA_BROKERS: kafka:9092
      HEALTH_ADDR: ":8097"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "8097:8097"

  # ── Placeholder services (replace with full implementations) ────────────────

  auth-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: auth-service/cmd/auth-service
    environment:
      HTTP_ADDR: ":8090"
      JWT_SECRET: cex-dev-jwt-secret-change-in-production
      JWT_ISSUER: cex-auth
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      DATABASE_URL: postgres://cex:cex@postgres:5432/cex?sslmode=disable
      REDIS_ADDR: redis:6379
      USER_SERVICE_URL: http://user-service:8091
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  user-service:
    <<: *go-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_PATH: user-service/cmd/user-service
    environment:
      HTTP_ADDR: ":8091"
      DATABASE_URL: postgres://cex:cex@postgres:5432/cex?sslmode=disable
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  matching-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/stubs/Dockerfile
    environment:
      SERVICE_NAME: matching-service
      HTTP_ADDR: ":8092"
    ports:
      - "8092:8092"
    networks:
      - cex

  # ── Monitoring ──────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - cex

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "3001:3000"   # 3001 on host — frontend uses :3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - cex

networks:
  cex:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
